server.port=8080
server.address=0.0.0.0

spring.application.name=demo

# PostgreSQL for production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chessmate}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chessuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chesspass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect

# Connection pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

app.secret-key=536756685970373367639792f243f4528482b4d625156468576d5a71347437
app.expiration-time=900000

# Logging
logging.level.root=INFO
logging.level.com.chessmate=DEBUG
