server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy pour le bot ML et les WebSockets
    location /api/chess/ {
        proxy_pass http://ml_bot_engine:8000/api/chess/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Proxy pour le moteur Stockfish
    location /api/chess/bestmove {
        proxy_pass http://stockfish_engine:8000/api/chess/bestmove;
        proxy_set_header Host $host;
    }

    # Proxy pour le backend Spring Boot
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy pour les parties jouées (Backend)
    location /parties-jouees/ {
        proxy_pass http://backend:8080/parties-jouees/;
        proxy_set_header Host $host;
    }

    # Gérer le routage React (Rediriger toutes les URL inconnues vers index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuration du cache pour les assets statiques
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}
