server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Indispensable pour résoudre les noms Docker au runtime
    resolver 127.0.0.11 valid=30s;

    # Proxy pour le moteur Stockfish - bestmove (route spécifique AVANT /api/chess/)
    location = /api/chess/bestmove {
        set $upstream_stockfish stockfish_engine;
        proxy_pass http://$upstream_stockfish:8000/api/chess/bestmove;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy pour l'évaluation (blunder detection) - via le backend Spring Boot
    location = /api/chess/evaluate {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8080/api/chess/evaluate;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy pour le bot ML, multiplayer et WebSockets (tout le reste de /api/chess/)
    location /api/chess/ {
        set $upstream_ml ml_bot_engine;
        proxy_pass http://$upstream_ml:8000/api/chess/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy pour les parties jouées (Backend)
    location /parties-jouees {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8080/parties-jouees;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy pour le backend Spring Boot (catch-all pour /api/)
    location /api/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Gérer le routage React (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuration du cache pour les assets statiques
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}
