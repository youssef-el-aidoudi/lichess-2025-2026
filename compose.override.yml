services:
  traefik:
    command:
      - --log.level=DEBUG
      - --api.debug=true
      - --global.checknewversion=false
      - --global.sendAnonymousUsage=true
      - --api=true
      - --api.dashboard=true
      - --ping=true
      - --ping.entryPoint=ping
      - --entrypoints.ping.address=:8080
      - --providers.docker=true
      - --providers.docker.watch=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/tls.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: true
    volumes:
      - ./backend:/app

  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    working_dir: /app
    volumes :
      - ./etl:/app
      - maven-cache:/root/.m2

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    entrypoint: [ "/bin/sh", "-c", "/app/dev-entrypoint.sh" ]
    working_dir: /app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: true
    volumes:
      - ./producer:/app

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    entrypoint: [ "/bin/sh", "-c", "/app/dev-entrypoint.sh" ]
    working_dir: /app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: true
    volumes:
      - ./worker:/app

  postgres:
    volumes:
      - ./postgres/scripts:/scripts
    networks:
      - public
    ports:
      - "5432:5432"

  minio:
    networks:
     - public
    ports:
      - "9000:9000"
      - "9001:9001"
    labels:
      #pour l'API (copie des gros fichiers via api et non pas l'UI)
      - traefik.http.routers.minio-api.entrypoints=websecure
      - traefik.http.routers.minio-api.tls=true
      - traefik.http.routers.minio-api.rule=Host(`minio-api.docker.localhost`)
      - traefik.http.routers.minio-api.service=minio-api
      - traefik.http.services.minio-api.loadbalancer.server.port=9000
      - traefik.http.routers.minio-api.middlewares=securityheaders
      - traefik.docker.network=chessmate_proxy

  benchmark_position_stats:
    networks:
      - internal
      - public
    profiles: [ "jobs" ] # le service ne sera pas lancé par défaut
    image: python:3.14.0
    working_dir: /app
    volumes:
      - ./benchmark_position_stats:/app
    command: >
      sh -c "
        pip install --no-cache-dir psycopg2-binary &&
        python main.py
      "
    depends_on:
      - postgres

volumes:
  maven-cache: