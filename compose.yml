services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=false

  rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=false

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://minio:9000}
    volumes:
      - minio-data:/data
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio.entrypoints=websecure
      - traefik.http.routers.minio.tls=true
      - traefik.http.services.minio.loadbalancer.server.port=80
      - traefik.docker.network=sens2viz_public
      - traefik.http.routers.minio.rule=Host(`${MINIO_HOST}`)
      - traefik.http.routers.minio.middlewares=securityheaders

  traefik:
    container_name: traefik
    build:
      context: ./traefik
    environment:
      ENV: production
    command:
      - --log.level=ERROR
      - --api.debug=false
      - --global.checknewversion=false
      - --global.sendAnonymousUsage=true
      - --api=true
      - --api.dashboard=false
      - --ping=true
      - --ping.entryPoint=ping
      - --entrypoints.ping.address=:8080
      - --providers.docker=true
      - --providers.docker.watch=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/tls.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/tls.yml:/etc/traefik/tls.yml:ro
    ports:
      - "80:80"
      - "443:443"
      - "8085:8080"
    networks:
      - public
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.service=api@internal
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true

      # Security headers https://owasp.org/www-project-secure-headers/index.html#configuration-proposal
      # Traefik ajoute automatiquement les en-têtes X-Forwarded-For
      # Configuration proposal
      - traefik.http.middlewares.securityheaders.headers.stsSeconds=31536000
      - traefik.http.middlewares.securityheaders.headers.stsIncludeSubdomains=true
      #      - traefik.http.middlewares.securityheaders.headers.frameDeny=true PGADMIN4 en a besoin :Refused to display 'https://pg4.docker.localhost/' in a frame because it set 'X-Frame-Options' to 'deny'.
      - traefik.http.middlewares.securityheaders.headers.contentTypeNosniff=true
      # Stack trop complexe pour gérer à la main le CSP.
      # On fait confiance aux apps pour le mettre le CSP elles-mêmes.
      #      - traefik.http.middlewares.securityheaders.headers.contentSecurityPolicy=default-src 'self'; script-src-elem 'self' https://cdn.jsdelivr.net 'sha256-QOOQu4W1oxGqd2nbXbxiA1Di6OHQOLQD+o+G9oWL8YY='; img-src 'self' https://fastapi.tiangolo.com data:; style-src 'self' https://cdn.jsdelivr.net; style-src-elem 'self' https://cdn.jsdelivr.net; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests; block-all-mixed-content
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.X-Permitted-Cross-Domain-Policies=none
      #      - traefik.http.middlewares.securityheaders.headers.referrerPolicy=no-referrer # Nécessaire pour PGADMIN4 sinon cela met "Failed to load preferences"
      #      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.Clear-Site-Data="cache","cookies","storage"
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.Cross-Origin-Embedder-Policy="require-corp"
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.Cross-Origin-Opener-Policy="same-origin"
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.Cross-Origin-Resource-Policy="same-origin"
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.Permissions-Policy=accelerometer=(), autoplay=(), camera=(), cross-origin-isolated=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(self), usb=(), web-share=(), xr-spatial-tracking=(), clipboard-read=(), clipboard-write=(), gamepad=(), hid=(), idle-detection=(), interest-cohort=(), serial=(), unload=()
      #      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.Cache-Control="no-store, max-age=0"
      # Prevent information disclosure via HTTP headers
      # $wsep ça fait bug et pas besoin car c'est WebSphere que l'on n'utilise pas.
      #      - traefik.http.middlewares.securityheaders.headers.customrequestheaders.$wsep=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.Host-Header=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.K-Proxy-Request=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.Liferay-Portal=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.OracleCommerceCloud-Version=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.Pega-Host=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.Powered-By=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.Product=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.Server=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.SourceMap=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.X-AspNet-Version=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.X-AspNetMvc-Version=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.X-Atmosphere-error=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.X-Atmosphere-first-request=""
      - traefik.http.middlewares.securityheaders.headers.customResponseHeaders.X-Atmosphere-tracking-id=""
