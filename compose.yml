networks:
  public:
    name: chessmate_public
    driver: bridge
  proxy:
    name: chessmate_proxy
    internal: true
  internal:
    name: chessmate_internal
    internal: true

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
