<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MCD Complet - ChessMate</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #d4d4d4;
    font-family: Arial, Helvetica, sans-serif;
    overflow: auto;
  }
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: #333; color: #fff; padding: 8px 16px;
    display: flex; align-items: center; gap: 12px;
    font-size: 13px;
  }
  .toolbar button {
    background: #00bcd4; color: #000; border: none; padding: 6px 14px;
    font-weight: bold; cursor: pointer; border-radius: 3px; font-size: 12px;
  }
  .toolbar button:hover { background: #00e5ff; }
  #canvas {
    position: relative;
    width: 2800px;
    height: 2000px;
    margin-top: 40px;
  }
  /* ENTITY BOXES - Yellow */
  .entity {
    position: absolute;
    background: #ffff70;
    border: 2px solid #000;
    min-width: 140px;
    font-size: 11px;
    cursor: move;
    z-index: 10;
  }
  .entity .ename {
    background: #ffff00;
    font-weight: bold;
    text-align: center;
    padding: 4px 8px;
    border-bottom: 2px solid #000;
    font-size: 12px;
  }
  .entity .attrs {
    padding: 4px 8px;
  }
  .entity .attrs div {
    padding: 1px 0;
  }
  .entity .attrs div.pk {
    font-weight: bold;
    text-decoration: underline;
  }
  /* ASSOCIATION ELLIPSES - Cyan */
  .assoc {
    position: absolute;
    z-index: 10;
    cursor: move;
  }
  .assoc .ellipse-bg {
    background: #00d4d4;
    border: 2px solid #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11px;
    font-weight: bold;
    padding: 6px 10px;
    min-width: 80px;
    min-height: 40px;
  }
  .assoc .assoc-attr {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    white-space: nowrap;
    margin-top: 2px;
  }
  /* LINES */
  svg.lines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    pointer-events: none;
  }
  svg.lines line, svg.lines path {
    stroke: #000;
    stroke-width: 1.5;
    fill: none;
  }
  svg.lines text {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    font-weight: bold;
    fill: #000;
  }
</style>
</head>
<body>

<div class="toolbar">
  <span>MCD Complet — ChessMate (Merise)</span>
  <button onclick="exportPNG()">📸 Exporter PNG</button>
  <button onclick="exportSVG()">📄 Exporter SVG</button>
</div>

<div id="canvas">
  <svg class="lines" id="linesSvg"></svg>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────
const entities = [
  { id:"joueur", name:"Joueur", attrs:["id","pseudonyme","elo","nb_victoires","nb_defaites","nb_nulles","equipe","fide_id"], x:500, y:300 },
  { id:"utilisateur", name:"Utilisateur", attrs:["id","email","hash","nom","prenom","inscription_a","connexion_a","banni_a", "id_joueur"], x:900, y:300 },
  { id:"cadence", name:"Cadence", attrs:["id","libelle","temps","increment","type_partie"], x:100, y:350 },
  { id:"role", name:"Role", attrs:["id","libelle"], x:1300, y:200 },
  { id:"profil", name:"Profil", attrs:["id","libelle"], x:1300, y:400 },
  { id:"tournoi", name:"Tournoi", attrs:["id","libelle","code","site","broadcast_url","date_debut","cree_a","modifie_a"], x:500, y:50 },
  { id:"partie", name:"Partie", attrs:["id","title","resultat","pgn","date_heure_utc","elo_blanc","elo_noir","score_blanc_diff","score_noir_diff","titre_blanc","titre_noir","type_resultat","round","broadcast_url","game_url","variant"], x:250, y:650 },
  { id:"ouverture", name:"Ouverture", attrs:["id","code","libelle"], x:600, y:900 },
  { id:"suite_coups", name:"Suite_Coups_Stats", attrs:["id","pgn","pgn_hash","nb_victoires","nb_defaites","nb_nulles","probabilite_coup"], x:900, y:750 },
  { id:"position_stats", name:"Position_Stats", attrs:["hash","fen","nb_total","nb_victoires_blanc","nb_victoires_noir","nb_nulles","updated_at"], x:500, y:700 },
  { id:"online_partie", name:"Online_Partie", attrs:["id","game_id","resultat","result_type","pgn","time_control","total_moves","played_at"], x:100, y:800 },
  { id:"friendship", name:"Friendship", attrs:["id","status","created_at"], x:850, y:100 },
  { id:"chat_message", name:"Chat_Message", attrs:["id","content","sent_at","game_id","is_read"], x:150, y:150 },
  { id:"tache", name:"TachePositionStats", attrs:["id","debut_partie_id","fin_partie_id","statut","worker_rank","debut_a","fin_a","tentative","message_erreur","cree_a"], x:1300, y:600 },
  { id:"position_stats_progress", name:"PositionStatsProgress", attrs:["id", "derniere_partie_id_calculee"], x:1300, y:800 },
  { id:"position_stats_stage", name:"Position_Stats_Stage", attrs:["hash", "fen", "nb_total", "nb_victoires_blanc", "nb_victoires_noir", "nb_nulles"], x:1300, y:950 }
];

const associations = [
  { id:"etre", name:"être", x:750, y:320, w:80, h:40 },
  { id:"organiser", name:"organiser", x:520, y:210, w:90, h:40 },
  { id:"participer", name:"participer", x:650, y:180, w:90, h:40, attr:"inscription" },
  { id:"jouer_blanc", name:"jouer\nblanc", x:350, y:450, w:85, h:45 },
  { id:"jouer_noir", name:"jouer\nnoir", x:450, y:500, w:85, h:45 },
  { id:"cadencer", name:"cadencer", x:150, y:550, w:85, h:40 },
  { id:"cadencer_t", name:"cadencer\ntournoi", x:250, y:250, w:90, h:45 },
  { id:"ouvrir", name:"ouvrir", x:450, y:850, w:80, h:40 },
  { id:"commencer", name:"commencer", x:750, y:850, w:90, h:40 },
  { id:"deplacer", name:"déplacer", x:700, y:650, w:85, h:40 },
  { id:"finir", name:"finir", x:400, y:750, w:70, h:36 },
  { id:"preceder", name:"précéder", x:1150, y:850, w:85, h:40 },
  { id:"avoir_role", name:"avoir_role", x:1100, y:250, w:80, h:40 },
  { id:"avoir_profil", name:"avoir_profil", x:1100, y:350, w:80, h:40 },
  { id:"lier", name:"lier", x:1320, y:320, w:60, h:36 },
  { id:"jouer_ob", name:"jouer\nonl. blanc", x:250, y:550, w:90, h:45 },
  { id:"jouer_on", name:"jouer\nonl. noir", x:150, y:550, w:90, h:45 },
  { id:"envoyer_demande", name:"envoyer\ndemande", x:680, y:200, w:90, h:45 },
  { id:"recevoir_demande", name:"recevoir\ndemande", x:750, y:150, w:90, h:45 },
  { id:"envoyer_msg", name:"envoyer\nmsg", x:350, y:220, w:80, h:38 },
  { id:"recevoir_msg", name:"recevoir\nmsg", x:420, y:280, w:80, h:38 },
];

// Links: [assocId, entityId, cardMin, cardMax]
const links = [
  ["etre","joueur","1","1"],
  ["etre","utilisateur","1","1"],
  ["organiser","joueur","0","n"],
  ["organiser","tournoi","1","1"],
  ["participer","joueur","0","n"],
  ["participer","tournoi","0","n"],
  ["jouer_blanc","joueur","0","n"],
  ["jouer_blanc","partie","1","1"],
  ["jouer_noir","joueur","0","n"],
  ["jouer_noir","partie","1","1"],
  ["cadencer","cadence","0","n"],
  ["cadencer","partie","0","1"],
  ["cadencer_t","cadence","0","n"],
  ["cadencer_t","tournoi","1","1"],
  ["ouvrir","ouverture","1","n"],
  ["ouvrir","partie","0","1"],
  ["commencer","suite_coups","0","1"],
  ["commencer","ouverture","1","1"],
  ["deplacer","suite_coups","0","n"],
  ["deplacer","partie","0","1"],
  ["finir","position_stats","0","n"],
  ["finir","partie","0","1"],
  ["preceder","suite_coups","0","1"], // Self-reference curved line is handled specifically below
  ["avoir_role","utilisateur","0","n"],
  ["avoir_role","role","0","n"],
  ["avoir_profil","utilisateur","0","n"],
  ["avoir_profil","profil","0","n"],
  ["lier","profil","0","n"],
  ["lier","role","0","n"],
  ["jouer_ob","joueur","0","n"],
  ["jouer_ob","online_partie","1","1"],
  ["jouer_on","joueur","0","n"],
  ["jouer_on","online_partie","1","1"],
  ["envoyer_demande","joueur","0","n"],
  ["envoyer_demande","friendship","1","1"],
  ["recevoir_demande","joueur","0","n"],
  ["recevoir_demande","friendship","1","1"],
  ["envoyer_msg","joueur","0","n"],
  ["envoyer_msg","chat_message","1","1"],
  ["recevoir_msg","joueur","0","n"],
  ["recevoir_msg","chat_message","1","1"],
];

// ─── RENDER ──────────────────────────────────────────────────────
const canvas = document.getElementById("canvas");

// Create entity DOM elements
entities.forEach(e => {
  const div = document.createElement("div");
  div.className = "entity";
  div.id = "e_" + e.id;
  div.style.left = e.x + "px";
  div.style.top = e.y + "px";
  div.innerHTML = `<div class="ename">${e.name}</div><div class="attrs">${e.attrs.map((a,i) => `<div class="${i===0?'pk':''}">${a}</div>`).join("")}</div>`;
  canvas.appendChild(div);
  makeDraggable(div);
});

// Create association DOM elements
associations.forEach(a => {
  const div = document.createElement("div");
  div.className = "assoc";
  div.id = "a_" + a.id;
  div.style.left = a.x + "px";
  div.style.top = a.y + "px";
  div.innerHTML = `<div class="ellipse-bg" style="width:${a.w}px;height:${a.h}px">${a.name}</div>${a.attr ? `<div class="assoc-attr">${a.attr}</div>` : ""}`;
  canvas.appendChild(div);
  makeDraggable(div);
});

function getCenter(el) {
  const r = el.getBoundingClientRect();
  const cr = canvas.getBoundingClientRect();
  return {
    x: el.offsetLeft + el.offsetWidth / 2,
    y: el.offsetTop + el.offsetHeight / 2
  };
}

function drawLines() {
  const svg = document.getElementById("linesSvg");
  svg.innerHTML = "";
  links.forEach(([assocId, entityId, cMin, cMax]) => {
    const aEl = document.getElementById("a_" + assocId);
    const eEl = document.getElementById("e_" + entityId);
    if (!aEl || !eEl) return;
    const ac = getCenter(aEl);
    const ec = getCenter(eEl);

    // If it's the preceder association, we draw a curved path back to the same entity twice
    if(assocId === "preceder" && entityId === "suite_coups") {
      // First line
      const path1 = document.createElementNS("http://www.w3.org/2000/svg","path");
      path1.setAttribute("d", `M ${ac.x} ${ac.y} Q ${ac.x} ${ec.y + 50} ${ec.x} ${ec.y}`);
      svg.appendChild(path1);
      
      const txt1 = document.createElementNS("http://www.w3.org/2000/svg","text");
      txt1.setAttribute("x", ac.x - 20);
      txt1.setAttribute("y", ec.y + 20);
      txt1.textContent = "0,1";
      svg.appendChild(txt1);

      // Second line
      const path2 = document.createElementNS("http://www.w3.org/2000/svg","path");
      path2.setAttribute("d", `M ${ac.x} ${ac.y} Q ${ec.x + 50} ${ac.y} ${ec.x} ${ec.y}`);
      svg.appendChild(path2);

      const txt2 = document.createElementNS("http://www.w3.org/2000/svg","text");
      txt2.setAttribute("x", ec.x + 20);
      txt2.setAttribute("y", ac.y - 10);
      txt2.textContent = "0,n";
      svg.appendChild(txt2);
      
      return; // Skip normal drawing
    }

    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1", ac.x);
    line.setAttribute("y1", ac.y);
    line.setAttribute("x2", ec.x);
    line.setAttribute("y2", ec.y);
    svg.appendChild(line);

    // Cardinality label near entity
    const dx = ec.x - ac.x;
    const dy = ec.y - ac.y;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len === 0) return;
    const ratio = 0.75;
    const lx = ac.x + dx * ratio;
    const ly = ac.y + dy * ratio;

    const txt = document.createElementNS("http://www.w3.org/2000/svg","text");
    txt.setAttribute("x", lx + 5);
    txt.setAttribute("y", ly - 5);
    txt.textContent = cMin + "," + cMax;
    svg.appendChild(txt);
  });
}

drawLines();

// ─── DRAG ────────────────────────────────────────────────────────
function makeDraggable(el) {
  let ox, oy, sx, sy;
  el.addEventListener("mousedown", e => {
    ox = e.clientX; oy = e.clientY;
    sx = el.offsetLeft; sy = el.offsetTop;
    function onMove(e2) {
      el.style.left = (sx + e2.clientX - ox) + "px";
      el.style.top = (sy + e2.clientY - oy) + "px";
      drawLines();
    }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

// ─── EXPORT ──────────────────────────────────────────────────────
function exportPNG() {
  const c = document.createElement("canvas");
  const scale = 2;
  c.width = 2800 * scale;
  c.height = 2000 * scale;
  const ctx = c.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = "#d4d4d4";
  ctx.fillRect(0, 0, 2800, 2000);

  // Draw lines
  links.forEach(([assocId, entityId, cMin, cMax]) => {
    const aEl = document.getElementById("a_" + assocId);
    const eEl = document.getElementById("e_" + entityId);
    if (!aEl || !eEl) return;
    const ac = getCenter(aEl);
    const ec = getCenter(eEl);

    if(assocId === "preceder" && entityId === "suite_coups") {
      ctx.beginPath();
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 1.5;
      ctx.moveTo(ac.x, ac.y);
      ctx.quadraticCurveTo(ac.x, ec.y + 50, ec.x, ec.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(ac.x, ac.y);
      ctx.quadraticCurveTo(ec.x + 50, ac.y, ec.x, ec.y);
      ctx.stroke();

      ctx.font = "bold 11px Arial";
      ctx.fillStyle = "#000";
      ctx.fillText("0,1", ac.x - 20, ec.y + 20);
      ctx.fillText("0,n", ec.x + 20, ac.y - 10);
      return;
    }

    ctx.beginPath();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 1.5;
    ctx.moveTo(ac.x, ac.y);
    ctx.lineTo(ec.x, ec.y);
    ctx.stroke();

    const dx = ec.x - ac.x;
    const dy = ec.y - ac.y;
    const ratio = 0.75;
    const lx = ac.x + dx * ratio;
    const ly = ac.y + dy * ratio;
    ctx.font = "bold 11px Arial";
    ctx.fillStyle = "#000";
    ctx.fillText(cMin + "," + cMax, lx + 5, ly - 5);
  });

  // Draw entities
  entities.forEach(e => {
    const el = document.getElementById("e_" + e.id);
    const x = el.offsetLeft;
    const y = el.offsetTop;
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    ctx.fillStyle = "#ffff70";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = "#ffff00";
    ctx.fillRect(x+1, y+1, w-2, 20);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y+22);
    ctx.lineTo(x+w, y+22);
    ctx.stroke();
    ctx.font = "bold 12px Arial";
    ctx.fillStyle = "#000";
    ctx.textAlign = "center";
    ctx.fillText(e.name, x + w/2, y + 16);
    ctx.font = "11px Arial";
    ctx.textAlign = "left";
    e.attrs.forEach((a, i) => {
      const ay = y + 36 + i * 14;
      if (i === 0) {
        ctx.font = "bold 11px Arial";
        ctx.fillText("_" + a + "_", x + 8, ay);
        const tw = ctx.measureText(a).width;
        ctx.beginPath();
        ctx.moveTo(x+8, ay+2);
        ctx.lineTo(x+8+tw, ay+2);
        ctx.strokeStyle = "#000"; ctx.lineWidth = 1;
        ctx.stroke();
        ctx.font = "11px Arial";
      } else {
        ctx.fillText(a, x + 8, ay);
      }
    });
  });

  // Draw associations
  associations.forEach(a => {
    const el = document.getElementById("a_" + a.id);
    const x = el.offsetLeft;
    const y = el.offsetTop;
    const ew = a.w;
    const eh = a.h;
    const cx = x + ew/2;
    const cy = y + eh/2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, ew/2, eh/2, 0, 0, Math.PI*2);
    ctx.fillStyle = "#00d4d4";
    ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = "bold 11px Arial";
    ctx.fillStyle = "#000";
    ctx.textAlign = "center";
    const lines = a.name.split("\n");
    lines.forEach((l, i) => {
      ctx.fillText(l, cx, cy + 4 + (i - (lines.length-1)/2) * 13);
    });
    if (a.attr) {
      ctx.font = "10px Arial";
      ctx.fillText(a.attr, cx, cy + eh/2 + 14);
    }
  });

  ctx.textAlign = "start";
  ctx.font = "bold 18px Arial";
  ctx.fillStyle = "#000";
  ctx.fillText("MCD Complet — ChessMate", 20, 30);

  const link = document.createElement("a");
  link.download = "MCD_ChessMate_Complet.png";
  link.href = c.toDataURL("image/png");
  link.click();
}

function exportSVG() {
  const svg = document.getElementById("linesSvg").cloneNode(true);
  svg.setAttribute("xmlns","http://www.w3.org/2000/svg");
  svg.setAttribute("width","2800");
  svg.setAttribute("height","2000");

  const bg = document.createElementNS("http://www.w3.org/2000/svg","rect");
  bg.setAttribute("width","2800"); bg.setAttribute("height","2000");
  bg.setAttribute("fill","#d4d4d4");
  svg.insertBefore(bg, svg.firstChild);

  entities.forEach(e => {
    const el = document.getElementById("e_" + e.id);
    const x = el.offsetLeft, y = el.offsetTop;
    const w = el.offsetWidth, h = el.offsetHeight;
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    const rect = document.createElementNS("http://www.w3.org/2000/svg","rect");
    rect.setAttribute("x",x); rect.setAttribute("y",y);
    rect.setAttribute("width",w); rect.setAttribute("height",h);
    rect.setAttribute("fill","#ffff70"); rect.setAttribute("stroke","#000"); rect.setAttribute("stroke-width","2");
    g.appendChild(rect);
    const hdr = document.createElementNS("http://www.w3.org/2000/svg","rect");
    hdr.setAttribute("x",x); hdr.setAttribute("y",y);
    hdr.setAttribute("width",w); hdr.setAttribute("height","22");
    hdr.setAttribute("fill","#ffff00");
    g.appendChild(hdr);
    const hline = document.createElementNS("http://www.w3.org/2000/svg","line");
    hline.setAttribute("x1",x); hline.setAttribute("y1",y+22);
    hline.setAttribute("x2",x+w); hline.setAttribute("y2",y+22);
    hline.setAttribute("stroke","#000"); hline.setAttribute("stroke-width","2");
    g.appendChild(hline);
    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",x+w/2); t.setAttribute("y",y+16);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("font-family","Arial"); t.setAttribute("font-size","12");
    t.setAttribute("font-weight","bold");
    t.textContent = e.name;
    g.appendChild(t);
    e.attrs.forEach((a,i) => {
      const at = document.createElementNS("http://www.w3.org/2000/svg","text");
      at.setAttribute("x",x+8); at.setAttribute("y",y+36+i*14);
      at.setAttribute("font-family","Arial"); at.setAttribute("font-size","11");
      if(i===0) { at.setAttribute("font-weight","bold"); at.setAttribute("text-decoration","underline"); }
      at.textContent = a;
      g.appendChild(at);
    });
    svg.appendChild(g);
  });

  associations.forEach(a => {
    const el = document.getElementById("a_" + a.id);
    const x = el.offsetLeft, y = el.offsetTop;
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    const ell = document.createElementNS("http://www.w3.org/2000/svg","ellipse");
    ell.setAttribute("cx",x+a.w/2); ell.setAttribute("cy",y+a.h/2);
    ell.setAttribute("rx",a.w/2); ell.setAttribute("ry",a.h/2);
    ell.setAttribute("fill","#00d4d4"); ell.setAttribute("stroke","#000"); ell.setAttribute("stroke-width","2");
    g.appendChild(ell);
    const lines = a.name.split("\n");
    lines.forEach((l,i) => {
      const t = document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x",x+a.w/2); t.setAttribute("y",y+a.h/2+4+(i-(lines.length-1)/2)*13);
      t.setAttribute("text-anchor","middle");
      t.setAttribute("font-family","Arial"); t.setAttribute("font-size","11"); t.setAttribute("font-weight","bold");
      t.textContent = l;
      g.appendChild(t);
    });
    svg.appendChild(g);
  });

  const blob = new Blob([new XMLSerializer().serializeToString(svg)], {type:"image/svg+xml"});
  const link = document.createElement("a");
  link.download = "MCD_ChessMate_Complet.svg";
  link.href = URL.createObjectURL(blob);
  link.click();
}
</script>
</body>
</html>
